<script>
(()=>{
const L=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+'₹'+a.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'L'};
const L0=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+'₹'+Math.round(a).toLocaleString('en-IN')+'L'};
const pc=(v,d=2)=>(v*100).toFixed(d)+'%';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
const NS='http://www.w3.org/2000/svg';
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e};
const K=()=>({a:css('--accent'),aS:css('--accent-soft'),f:css('--face'),fS:css('--face-soft'),m:css('--muted'),l:css('--line'),fa:css('--faint'),ink:css('--ink'),par:css('--par'),d:css('--disc'),surf:css('--surface')});
const T=(s,x,y,t,o={})=>s.append(el('text',{x,y,'text-anchor':o.anchor||'middle',class:o.mono?'mono':'',style:`fill:${o.fill||css('--muted')};${o.bold?'font-weight:600;':''}${o.size?'font-size:'+o.size+'px;':''}`},t));
const Rc=(s,x,y,w,h,fill,o={})=>{if(h<=0||w<=0)return;s.append(el('rect',{x,y,width:w,height:h,fill,rx:o.rx??3,...(o.stroke?{stroke:o.stroke,'stroke-width':o.sw||1}:{}),...(o.op!=null?{opacity:o.op}:{})}))};
const Ln=(s,x1,y1,x2,y2,st,w=1)=>s.append(el('line',{x1,y1,x2,y2,stroke:st,'stroke-width':w}));
const note=t=>`<div class="nt">${t}</div>`;
const npv=(c,r)=>c.reduce((s,x,t)=>s+x/Math.pow(1+r,t),0);
const irr=(c,lo=0,hi=1)=>{for(let i=0;i<100;i++){const m=(lo+hi)/2;(npv(c,lo)*npv(c,m)<=0)?hi=m:lo=m}return (lo+hi)/2};
const P=[-200,50,100,150],PB=[-200,100,100,10],TA=[-100,100,10,10],TB=[-100,10,10,120],MU=[-200,200,800,-800];
const IRRP=irr(P);

/* NPV profile chart: series [{c,col,name}] */
function profile(s,k,series,{rmin=0,rmax=0.4,ymin,ymax,R=null,marks=[],ytick,xtick=0.1,top=24,base=280}){
  const Lx=78,Rx=110,pw=760-Lx-Rx,ph=base-top,X=r=>Lx+pw*(r-rmin)/(rmax-rmin),Y=v=>base-ph*(Math.max(ymin,Math.min(ymax,v))-ymin)/(ymax-ymin);
  for(let v=Math.ceil(ymin/ytick)*ytick;v<=ymax+1e-9;v+=ytick){Ln(s,Lx,Y(v),Lx+pw,Y(v),v===0?k.ink:k.l,v===0?1.5:1);T(s,Lx-8,Y(v)+4,L0(v),{anchor:'end',size:11})}
  for(let r=Math.ceil(rmin/xtick-1e-9)*xtick;r<=rmax+1e-9;r+=xtick)T(s,X(r),base+18,Math.round(r*100)+'%',{size:11});
  T(s,Lx+pw/2,base+36,'Discount rate',{size:12});
  series.forEach(({c,col,name})=>{const pts=[];for(let r=rmin;r<=rmax+1e-9;r+=(rmax-rmin)/200)pts.push(X(r)+','+Y(npv(c,r)));
    s.append(el('polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':3,'stroke-linejoin':'round'}));
    if(name){const v=npv(c,rmax);T(s,Lx+pw+8,Y(v)+4,name,{anchor:'start',fill:col,bold:1,size:12})}});
  if(R!=null){Ln(s,X(R),top,X(R),base,k.m,1);T(s,X(R)+4,top+12,'R = '+pc(R,1),{anchor:'start',size:11,fill:k.ink})}
  marks.forEach(([r,v,col,lab,dy=-12,an='middle'])=>{s.append(el('circle',{cx:X(r),cy:Y(v),r:6,fill:k.surf,stroke:col,'stroke-width':2.5}));if(lab)T(s,X(r)+(an==='start'?8:an==='end'?-8:0),Y(v)+dy,lab,{anchor:an,fill:col,bold:1,size:12,mono:1})});
  return {X,Y};
}
/* payback as "filling the cost": each year's cash flow fills the cost bar from left to right */
function fillChart(s,k,rows,{cut}){
  const x0=150,sc=520/300,X=v=>x0+v*sc,cx=X(200);
  Ln(s,cx,30,cx,300,k.ink,2);T(s,cx,22,'Cost ₹200L recovered here',{fill:k.ink,bold:1,size:12});
  rows.forEach(({name,col,flows},j)=>{const y=58+j*130,hgt=46;let cum=0;
    T(s,24,y+hgt/2+5,name,{anchor:'start',fill:col,bold:1,size:14});
    Rc(s,X(0),y,200*sc,hgt,k.fa,{stroke:k.l,rx:4});
    let pb=null,byCut=0;
    flows.forEach((c,i)=>{const t=i+1,a=cum,b=cum+c;
      const inPart=Math.max(0,Math.min(b,200)-a),outPart=c-inPart,op=[.45,.72,1][i];
      if(inPart>0)Rc(s,X(a),y,inPart*sc,hgt,col,{rx:0,op});
      if(outPart>0)Rc(s,X(Math.max(a,200)),y+8,outPart*sc,hgt-16,col,{rx:0,op:.18,stroke:col});
      const wi=inPart*sc,wo=outPart*sc,lab=`Yr ${t}: ${L0(c)}`;
      if(wi>78)T(s,X(a)+wi/2,y+hgt/2+5,lab,{fill:op>.6?k.surf:k.ink,bold:1,size:11,mono:1});
      else if(wo>78)T(s,X(Math.max(a,200))+wo/2,y+hgt/2+5,lab,{fill:k.ink,bold:1,size:11,mono:1});
      else if(wi>22)T(s,X(a)+wi/2,y+hgt/2+5,'Y'+t,{fill:op>.6?k.surf:k.ink,bold:1,size:10});
      if(pb==null&&b>=200-1e-9&&c>0)pb=i+(200-a)/c;
      if(cut>=t)byCut=b;else if(cut>i)byCut=a+(cut-i)*c;
      Ln(s,X(b),y-4,X(b),y+hgt+4,k.surf,1.5);cum=b});
    const bx=X(byCut);s.append(el('polygon',{points:`${bx-7},${y+hgt+16} ${bx+7},${y+hgt+16} ${bx},${y+hgt+5}`,fill:k.d}));
    const nr=Math.abs(bx-cx)<70;T(s,nr?bx-8:bx,y+hgt+30,`by cutoff: ${L0(byCut)}`,{anchor:nr?'end':'middle',fill:k.d,bold:1,size:11});
    if(cum>200.5)T(s,X(200)+6,y-8,'after payback: ignored',{anchor:'start',size:11,fill:col});
    const msg=pb!=null?`Paid back in ${pb.toFixed(2)} years`:`Never paid back: ${L0(200-cum)} short`;
    T(s,X(0),y-8,msg,{anchor:'start',fill:k.ink,bold:1,size:12});
  });
}
/* cumulative cash-flow chart */
function cumChart(s,k,series,{ymin=-220,ymax=140,cut=null}){
  const Lx=78,Rx=110,top=30,base=270,pw=760-Lx-Rx,ph=base-top,X=t=>Lx+pw*t/3,Y=v=>base-ph*(v-ymin)/(ymax-ymin);
  for(let v=-200;v<=ymax;v+=50){Ln(s,Lx,Y(v),Lx+pw,Y(v),v===0?k.ink:k.l,v===0?1.5:1);T(s,Lx-8,Y(v)+4,L0(v),{anchor:'end',size:11})}
  [0,1,2,3].forEach(t=>T(s,X(t),base+18,t?'Year '+t:'Today',{size:12}));

 {id:'pi',name:'Profitability index',short:'Value per rupee invested',

   Ln(s,150,base,600,base,k.l,1.5);T(s,640,base-h(200),`PI = ${pi.toFixed(3)}`,{mono:1,bold:1,fill:pi>=1?k.par:k.d,size:18});T(s,640,base-h(200)+20,pi>=1?'above 1: accept':'below 1: reject',{size:12,fill:pi>=1?k.par:k.d,bold:1});
   return {legend:[[k.d,'Cost'],[k.a,'Present value of inflows']],

 {id:'interp',name:'Finding IRR by interpolation',short:'16% + 4% × 13.52 ÷ 15.60',
  def:'IRR by hand. Find NPV at a rate where it is positive (16%) and at a rate where it is negative (20%). Zero lies between them, so IRR lies between 16% and 20%. How far along? Compare the distance from each NPV to zero with the total distance.',
  contrast:'Work from either side and you get the same answer: add from 16%, or subtract from 20%. It is an estimate because the true NPV line is slightly curved; the exact IRR is 19.44%. Keep the two trial rates close for a good estimate.',ctl:[],
  draw(s,st){const k=K(),r1=.16,r2=.20,N1=npv(P,r1),N2=npv(P,r2),gap=N1-N2,est=r1+(r2-r1)*N1/gap,CX=[220,340,460,580],NX=690;
   ['Today','Year 1','Year 2','Year 3'].forEach((t,i)=>T(s,CX[i],14,t,{bold:1,fill:k.ink,size:12}));T(s,NX,14,'NPV',{bold:1,fill:k.ink,size:12});
   T(s,24,40,'Cash flows',{anchor:'start',bold:1,fill:k.ink,size:12});
   P.forEach((v,i)=>{const pos=v>0;Rc(s,CX[i]-42,26,84,22,pos?k.aS:k.fa,{stroke:pos?k.a:k.l,rx:6});T(s,CX[i],41,L0(v),{mono:1,bold:1,size:12,fill:pos?k.a:k.ink})});
   [[r1,N1,k.par,76],[r2,N2,k.d,108]].forEach(([r,N,col,y])=>{T(s,24,y,'At '+pc(r,0),{anchor:'start',bold:1,fill:col,size:12});
    P.forEach((v,i)=>{T(s,CX[i],y,i?(v/Math.pow(1+r,i)).toFixed(2):'−200.00',{mono:1,size:12,fill:k.ink});if(i<3)T(s,(CX[i]+CX[i+1])/2,y,'+',{size:12})});
    T(s,(CX[3]+NX)/2-6,y,'=',{size:12});T(s,NX,y,(N>=0?'+':'')+L(N),{mono:1,bold:1,size:13,fill:col})});
   Ln(s,24,124,736,124,k.l,1);
   const vmin=-5,vmax=16,x0=60,x1=700,X=v=>x0+(v-vmin)/(vmax-vmin)*(x1-x0),y=212;
   T(s,24,146,'NPV on a number line',{anchor:'start',bold:1,fill:k.ink,size:12});
   Ln(s,x0,y,x1,y,k.m,1.5);
   for(let v=-4;v<=16;v+=4){Ln(s,X(v),y-4,X(v),y+4,k.m,1);if(v)T(s,X(v),y+18,v,{size:10})}
   Ln(s,X(0),y-12,X(0),y+12,k.ink,2.5);T(s,X(0),y+20,'0',{bold:1,size:12,fill:k.ink});
   T(s,x0,y-8,'negative',{anchor:'start',size:11,fill:k.d});T(s,x1,y-8,'positive',{anchor:'end',size:11,fill:k.par});
   [[N2,k.d,'NPV at 20%'],[N1,k.par,'NPV at 16%']].forEach(([v,col,lab])=>{s.append(el('circle',{cx:X(v),cy:y,r:7,fill:col}));T(s,X(v),y-34,lab,{bold:1,size:12,fill:col});T(s,X(v),y-18,(v>=0?'+':'')+v.toFixed(2),{mono:1,bold:1,size:12,fill:col})});
   const br=(a,b,yy,col,lab)=>{Ln(s,X(a),yy,X(b),yy,col,2);Ln(s,X(a),yy-6,X(a),yy+6,col,2);Ln(s,X(b),yy-6,X(b),yy+6,col,2);if(X(b)-X(a)<110){T(s,X(a)-10,yy+4,lab,{anchor:'end',mono:1,bold:1,size:12,fill:col});return}Rc(s,(X(a)+X(b))/2-44,yy-9,88,18,k.surf,{rx:3});T(s,(X(a)+X(b))/2,yy+4,lab,{mono:1,bold:1,size:12,fill:col})};
   br(N2,0,252,k.d,Math.abs(N2).toFixed(2));br(0,N1,252,k.par,N1.toFixed(2));br(N2,N1,290,k.ink,'total '+gap.toFixed(2));
   return {legend:[[k.par,'NPV at 16%: distance to zero'],[k.d,'NPV at 20%: distance to zero'],[k.ink,'Total distance']],
    work:`<div>Total distance = ${N1.toFixed(2)} + ${Math.abs(N2).toFixed(2)} = <b>${gap.toFixed(2)}</b></div><div class="prop"><div class="ph">If a distance of ${gap.toFixed(2)} is 4%, how much is ${N1.toFixed(2)}?</div>
<div class="pr"><span>Total distance <b>${gap.toFixed(2)}</b></span><i>↔</i><span><b>4%</b> (20% − 16%)</span></div>
<div class="pr"><span>16% to zero <b style="color:var(--par)">${N1.toFixed(2)}</b></span><i>↔</i><span><b>?</b> = 4% × ${N1.toFixed(2)} ÷ ${gap.toFixed(2)} = <b class="c">${pc(est-r1)}</b></span></div></div>
<div class="k">So, from 16%, add</div><div>IRR ≈ 16% + ${pc(est-r1)} = <span class="c">${pc(est)}</span></div><div class="k">Check from 20%, subtract</div><div>20% − 4% × <span style="color:var(--disc)">${Math.abs(N2).toFixed(2)}</span> ÷ ${gap.toFixed(2)} = ${pc(est)}</div><div class="big">IRR ≈ ${pc(est)}</div>`}}}
 ]};

const STEPS=[S0,S1,S2,S3,S5];

/* ================= framework ================= */
const stepper=document.getElementById('stepper'),host=document.getElementById('steps');
STEPS.forEach((S,si)=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',si===0);b.innerHTML=`<small>Step ${S.n}</small><span>${S.label}</span>`;
  b.addEventListener('click',()=>{[...stepper.children].forEach(x=>x.setAttribute('aria-selected',x===b));STEPS.forEach(X=>X.sec.hidden=X!==S);S.render();window.scrollTo({top:0,behavior:'smooth'})});
  stepper.append(b);
  const sec=document.createElement('section');sec.className='step';sec.hidden=si>0;S.sec=sec;
  sec.innerHTML=`<div class="wrap"><header><p class="eyebrow">${S.eyebrow}</p><h2 class="steph">${S.title}</h2><p class="sub">${S.sub}</p><div class="spec" aria-label="The project"></div></header>
   <div class="layout"><div class="index" role="tablist" aria-label="Concepts"></div>
   <section class="stage" role="tabpanel" aria-live="polite"><h2 class="nm"></h2><p class="def"></p>
   <svg viewBox="0 0 760 330" role="img"></svg><div class="trio legend"></div>
   <div class="readout"><div class="work"></div><div class="ctl"></div></div><div class="free" hidden></div>
   <p class="contrast"></p><div class="nav"><button class="btn prev">Previous</button><button class="btn primary next">Next</button></div></section></div></div>`;
  host.append(sec);
  const q=c=>sec.querySelector(c),idx=q('.index');let cur=0;
  if(S.solo){q('.layout').classList.add('solo');if(S.tabs.length===1)idx.hidden=true;else idx.classList.add('desk-hide')}
  S.tabs.forEach((t,i)=>{const bt=document.createElement('button');bt.className='term';bt.setAttribute('role','tab');bt.innerHTML=`<b>${t.name}</b><span>${t.short}</span>`;bt.addEventListener('click',()=>show(i));idx.append(bt)});
  q('.prev').addEventListener('click',()=>show(cur-1));q('.next').addEventListener('click',()=>{if(cur<S.tabs.length-1)show(cur+1);else if(STEPS[si+1])stepper.children[si+1].click()});
  S.go=i=>show(i);
  function show(i){cur=Math.max(0,Math.min(S.tabs.length-1,i));const t=S.tabs[cur];
    [...idx.children].forEach((b,j)=>b.setAttribute('aria-selected',j===cur));
    q('.nm').textContent=t.name;q('.def').textContent=t.def;q('.contrast').textContent=t.contrast;
    q('.prev').disabled=cur===0;const last=cur===S.tabs.length-1;q('.next').disabled=last&&!STEPS[si+1];q('.next').textContent=last&&STEPS[si+1]?'Next: '+STEPS[si+1].label:'Next';q('.prev').style.visibility=S.tabs.length===1?'hidden':'';q('.next').style.visibility=last&&!STEPS[si+1]?'hidden':'';q('svg').setAttribute('aria-label',t.name+' chart');
    buildCtl(t);S.render()}
  function buildCtl(t){const box=q('.ctl');box.innerHTML='';box.hidden=!t.ctl.length;q('.readout').classList.toggle('noctl',!t.ctl.length);
    t.ctl.forEach(c=>{
      if(c.type==='seg'){const w=document.createElement('div');w.className='seg';
        c.options.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.classList.toggle('on',S.state[c.key]===v);b.addEventListener('click',()=>{S.state[c.key]=v;[...w.children].forEach(x=>x.classList.toggle('on',x===b));S.render()});w.append(b)});box.append(w);return}
      const id=`s${S.n}-${t.id}-${c.key}`,w=document.createElement('div');w.className='ctl';
      w.innerHTML=`<label for="${id}">${c.label} <output></output></label><input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${Math.min(c.max,Math.max(c.min,S.state[c.key]))}">${c.note?`<small>${c.note}</small>`:''}`;
      const inp=w.querySelector('input'),out=w.querySelector('output');S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);
      inp.addEventListener('input',()=>{S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);S.render()});box.append(w)})}
  S.render=()=>{const t=S.tabs[cur],svg=q('svg');svg.innerHTML='';
    const sp=S.spec(S.state,t.id);q('.spec').hidden=!sp.length;
    q('.spec').innerHTML='<div class="spec-h">The project</div>'+sp.map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('');
    const free=!!t.html;svg.toggleAttribute('hidden',free);q('.legend').hidden=free;q('.readout').hidden=free;q('.free').hidden=!free;
    if(free){q('.free').innerHTML=t.html();return}
    const out=t.draw(svg,S.state);q('.work').innerHTML=out.work;
    q('.legend').innerHTML=out.legend.map(([c,l,st])=>`<span><i style="background:${c};${st?'border:1px solid '+st:''}"></i>${l}</span>`).join('')};
  show(0);
});
const rr=()=>STEPS.forEach(S=>S.render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
