<script>
(()=>{
const L=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+'₹'+a.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'L'};
const f2=v=>Math.abs(v)<0.005?'–':v<0?`(${Math.abs(v).toFixed(2)})`:v.toFixed(2);
const pc=(v,d=1)=>(v*100).toFixed(d)+'%';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS='http://www.w3.org/2000/svg';
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e};
const K=()=>({a:css('--accent'),aS:css('--accent-soft'),f:css('--face'),fS:css('--face-soft'),m:css('--muted'),l:css('--line'),fa:css('--faint'),ink:css('--ink'),par:css('--par'),d:css('--disc'),surf:css('--surface')});
const T=(s,x,y,t,o={})=>s.append(el('text',{x,y,'text-anchor':o.anchor||'middle',class:o.mono?'mono':'',style:`fill:${o.fill||css('--muted')};${o.bold?'font-weight:600;':''}${o.size?'font-size:'+o.size+'px;':''}`},t));
const Rc=(s,x,y,w,h,fill,o={})=>{if(h<=0||w<=0)return;s.append(el('rect',{x,y,width:w,height:h,fill,rx:o.rx??3,...(o.stroke?{stroke:o.stroke,'stroke-width':o.sw||1}:{}),...(o.op!=null?{opacity:o.op}:{})}))};
const Ln=(s,x1,y1,x2,y2,st,w=1)=>s.append(el('line',{x1,y1,x2,y2,stroke:st,'stroke-width':w}));
const note=t=>`<div class="nt">${t}</div>`;
const npv=(c,r)=>c.reduce((s,x,t)=>s+x/Math.pow(1+r,t),0);
const irr=c=>{let lo=-0.5,hi=1;for(let i=0;i<100;i++){const m=(lo+hi)/2;(npv(c,lo)*npv(c,m)<=0)?hi=m:lo=m}return (lo+hi)/2};

/* The project, from the course deck, in ₹ lakh: Nilgiri Packaging's three-year expansion */
const P0={sales:24,costs:9.6,inv:27,T:35,nwc:3,salv:2.1,R:15,D:40};

/* ================= STEP 1: what counts ================= */
const S1={n:1,label:'What counts',eyebrow:'Step 1 · Cash flows, not profits',title:'Which Cash Flows Count?',
 sub:'Nilgiri Packaging is considering a three-year expansion. The machine costs ₹27 lakh, sales will be ₹24 lakh a year and costs ₹9.6 lakh a year. We want the cash this project gives to the long-term suppliers of funds, not its accounting profit.',
 state:{...P0},
 spec:(st)=>[['Machine','₹27L, 3-year life','d'],['Sales','₹24L a year','c'],['Costs','₹9.6L a year','d'],['Tax rate',st.T+'%','']],
 tabs:[
 {id:'cash',name:'Cash flow, not profit',short:'Profit, then add back depreciation',
  def:'Start from sales, take away costs and depreciation, and pay tax: that is profit after tax. Depreciation was subtracted only to work out the tax; no cash left the firm. So add it back. Interest is never subtracted: the cost of finance is in the discount rate.',
  contrast:'Depreciation matters only because it lowers tax. Raise the tax rate and the operating cash flow falls, but by less than the profit does, because depreciation shields part of the income from tax.',
  ctl:[{key:'T',label:'Tax rate',min:0,max:50,step:1,fmt:v=>v+'%',note:'The deck uses 35%.'}],
  draw(s,st){const k=K(),t=st.T/100,dep=st.inv/3,pbt=st.sales-st.costs-dep,tax=pbt*t,pat=pbt-tax,ocf=pat+dep;
   const base=286,Y=v=>base-v*9.4,X=i=>70+i*88,w=58;
   const steps=[['Sales',0,st.sales,k.a,'+'],['Costs',st.sales,st.sales-st.costs,k.d,'−'],['Depreciation',st.sales-st.costs,pbt,k.d,'−'],['PBT',0,pbt,k.f,'='],['Tax',pbt,pat,k.d,'−'],['PAT',0,pat,k.f,'='],['Add back dep.',pat,ocf,k.par,'+'],['OCF',0,ocf,k.a,'=']];
   Ln(s,30,base,740,base,k.l,1.5);
   steps.forEach(([n,a,b,col,sg],i)=>{const top=Math.max(a,b),bot=Math.min(a,b),x=X(i)-w/2;
    Rc(s,x,Y(top),w,Math.max(1.5,Y(bot)-Y(top)),col,{rx:3,op:sg==='='?1:.85});
    if(i<steps.length-1){const nx=steps[i+1],lv=sg==='='?b:b;Ln(s,x+w,Y(lv),X(i+1)-w/2,Y(lv),k.l,1)}

/* ================= STEP 2: build the cash flows ================= */
function model(st,lvl){const t=st.T/100,dep=st.inv/3,Y=[1,2,3],r={};
 r.sales=[0,...Y.map(()=>st.sales)];r.costs=[0,...Y.map(()=>-st.costs)];r.dep=[0,...Y.map(()=>-dep)];
 r.pbt=r.sales.map((v,i)=>v+r.costs[i]+r.dep[i]);r.tax=r.pbt.map(v=>-v*t);r.pat=r.pbt.map((v,i)=>v+r.tax[i]);r.adddep=r.dep.map(v=>-v);r.ocf=r.pat.map((v,i)=>v+r.adddep[i]);
 r.inv=[-st.inv,0,0,0];r.nwc=lvl>=2?[-st.nwc,0,0,st.nwc]:[0,0,0,0];
 const nsv=st.salv-t*(st.salv-0);r.nsv=lvl>=3?[0,0,0,nsv]:[0,0,0,0];
 r.cf=r.ocf.map((v,i)=>v+r.inv[i]+r.nwc[i]+r.nsv[i]);r.df=r.cf.map((_,i)=>1/Math.pow(1+st.R/100,i));r.pv=r.cf.map((v,i)=>v*r.df[i]);r.npv=r.pv.reduce((a,b)=>a+b,0);r.nsvv=nsv;return r}
const ROWS=[['sales','Sales','',1],['costs','Costs','',1],['dep','Depreciation','',1],['pbt','PBT','sub',1],['tax','Tax','',1],['pat','PAT','sub',1],['adddep','Add: depreciation','',1],['ocf','Operating cash flow','sub',1],['inv','Initial investment','',1],['nwc','Change in NWC','',2],['nsv','Net salvage value','',3],['cf','Cash flow','tot',1]];
function table(r,lvl,hl,cols,extra=[]){
 const head=`<tr><th>₹ lakh</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
 const body=ROWS.filter(x=>x[3]<=lvl).map(([k,lab,cls])=>`<tr class="${cls} ${hl.includes(k)?'hl':''}"><td>${lab}</td>${r[k].map(v=>`<td class="${v<-0.004?'neg':''}">${f2(v)}</td>`).join('')}</tr>`).join('');
 return `<div class="tw"><table class="cft">${head}${body}${extra.join('')}</table></div>`}
const nwcRule=()=>`<div class="nwcr"><div class="nb up"><b>NWC goes up</b><span class="big">Cash OUT · subtract</span><span>More stock bought, more credit given to customers: cash gets locked up.</span></div><div class="nb dn"><b>NWC goes down</b><span class="big">Cash IN · add</span><span>Stock sold off, customers pay up, more credit from suppliers: locked cash comes back.</span></div></div>`;
const S2={n:2,label:'Build the cash flows',eyebrow:'Step 2 · A new project, row by row',title:'Building the Project Cash Flows',
 sub:'The deck’s template, filled in one block at a time: operating cash flow, then working capital, then salvage value, and finally the NPV.',
 state:{...P0,why:0},
 spec:(st)=>[['Machine','₹27L, SLM to zero','d'],['Sales, costs','₹'+st.sales+'L, ₹9.6L','c'],['Tax rate',st.T+'%',''],['Required return',st.R+'%','']],
 tabs:[
 {id:'why',name:'Why add, why subtract?',short:'The template, row by row',
  def:'The template starts from accounting profit and turns it into cash. Each adjustment fixes one gap between profit and cash. Pick an adjustment to see why it is there.',
  contrast:'One question explains every row: did cash actually move, and when? Profit records sales and costs when they are earned or matched; the project is worth the cash that moves in and out, year by year.',
  ctl:[{key:'why',type:'seg',options:[[0,'Depreciation, added back'],[1,'Change in NWC'],[2,'Net salvage value'],[3,'Why no interest?']]}],
  draw(s,st){const t=st.T/100,dep=st.inv/3,pbt=st.sales-st.costs-dep,tax=pbt*t,taxNo=(st.sales-st.costs)*t,nsv=st.salv-t*st.salv;
   const rows=[['Sales','+','cash in','c',[]],['Expense','−','cash out','d',[]],['Depreciation','−','not cash: only to work out tax','m',[0]],['PBT','','','s',[]],['Tax','−','cash out, to the government','d',[]],['PAT','','','s',[]],['Add: depreciation','+','undo the non-cash charge','c',[0]],['Add or subtract: change in NWC','∓','cash locked in, or released','f',[1]],['Add: net salvage value','+','cash from selling the machine','c',[2]],['Interest','✕','not here: in the discount rate','x',[3]],['Cash flow','=','','s',[]]];
   const tbl=`<table class="tpl">${rows.map(([n,sg,tag,c,hl])=>`<tr class="${c==='s'?'sub':''} ${c==='x'?'strike':''} ${hl.includes(st.why)?'on':''}"><td class="sg ${c}">${sg}</td><td>${n}</td><td class="tag">${tag}</td></tr>`).join('')}</table>`;
   const cards=[
    ['Subtract depreciation, then add it back',`<p>The machine’s <b>₹27L left the bank on day 0</b>; that cash is already in year 0. Depreciation spreads the same cost over three years in the accounts, ₹9L a year, but <b>no cash leaves in years 1 to 3</b>.</p><p>We subtract it only because the tax rules allow it, so it lowers the tax bill. Once tax is worked out, we add it back. Otherwise the same ₹27L would be counted twice.</p>`,`Tax without depreciation: 35% × ${(st.sales-st.costs).toFixed(2)} = ${taxNo.toFixed(2)}<br>Tax with depreciation: 35% × ${pbt.toFixed(2)} = ${tax.toFixed(2)}<br><b>Tax saved: ${(taxNo-tax).toFixed(2)} = 35% × ${dep.toFixed(2)}</b>, the only cash effect of depreciation.`],
    ['Subtract an increase in working capital, add it back at the end',`<p>To run the line, Nilgiri must <b>hold stock and give customers credit</b>. ₹${st.nwc.toFixed(2)}L of cash sits in the warehouse and with customers instead of in the bank.</p><p>That cash is gone, yet <b>no expense shows in the profit and loss</b>, so the template subtracts it. When the project ends, the stock is sold off and customers pay up: the cash comes back, so it is added.</p>`,nwcRule()+`Here: −${st.nwc.toFixed(2)} in year 0 (NWC up), +${st.nwc.toFixed(2)} in year 3 (NWC back to zero).`],
    ['Add the net salvage value',`<p>At the end the machine is sold. That is <b>real cash</b>, but it is not part of sales, so it needs its own row.</p><p>The machine was depreciated to zero, so the whole sale price is a <b>gain over book value, and the gain is taxed</b>. Add only what is left after that tax.</p>`,`NSV = Salvage − T × (Salvage − Book value)<br>= ${st.salv.toFixed(2)} − 0.35 × (${st.salv.toFixed(2)} − 0) = <b>${nsv.toFixed(2)}</b>`],
    ['Why is interest not subtracted?',`<p>We are valuing the project for <b>all its long-term suppliers of funds</b>, lenders and shareholders together, not just for shareholders.</p><p>What they all require is captured in the <b>discount rate</b>. Subtracting interest in the cash flows as well would charge for the same money twice.</p>`,`Financing costs go in the discount rate, never in the cash flows.`]];
   const [h,b,ex]=cards[st.why];
   return {html:`<div class="why"><div>${tbl}</div><div class="wcard"><h3>${h}</h3>${b}<div class="wex">${ex}</div></div></div>`,legend:[],
    work:`<div class="fm">Cash flow = PAT + Depreciation − Change in NWC + Net salvage value</div><div>Each term is a correction from profit to cash.</div>`}}},
 {id:'ocf',name:'Operating cash flow',short:'Sales to OCF',
  def:'Each year: sales less costs less depreciation gives PBT. Take away tax to get PAT, then add depreciation back. Year 0 carries the cost of the machine.',

  ctl:[{key:'sales',label:'Annual sales',min:16,max:32,step:0.5,fmt:v=>'₹'+v.toFixed(1)+'L',note:'Costs stay at ₹9.6L a year.'}],
  draw(s,st){const r=model(st,1);return {html:table(r,1,['sales','costs','dep','pbt','tax','pat','adddep','ocf'],['0','1','2','3']),legend:[],
   work:`<div class="fm">OCF = (Sales − Costs − Dep) × (1 − T) + Dep</div><div>= (${st.sales.toFixed(2)} − 9.60 − 9.00) × 0.65 + 9.00</div><div class="big">OCF = ${L(r.ocf[1])}</div>`+note(`NPV at ${st.R}% so far: ${L(r.npv)}.`)}}},
 {id:'nwc',name:'Net working capital',short:'Cash tied up, then returned',
  def:'The project needs extra stock and credit to customers from day one. That money is put in at year 0 and comes back when the project ends and the stock is sold off.',
  contrast:'You get every rupee of working capital back, yet NPV falls: money put in today returns three years later, and ₹3L in year 3 is worth less than ₹3L today.',
  ctl:[{key:'nwc',label:'Working capital needed',min:0,max:8,step:0.5,fmt:v=>'₹'+v.toFixed(1)+'L',note:'Recovered in full at the end.'}],
  draw(s,st){const r=model(st,2),r1=model(st,1);return {html:nwcRule()+table(r,2,['nwc'],['0','1','2','3']),legend:[],
   work:`<div>Year 0: −${L(st.nwc)} · Year 3: +${L(st.nwc)}</div><div>Cost in today’s money = ${st.nwc.toFixed(2)} − ${st.nwc.toFixed(2)} ÷ 1.15³ = <span class="c">${L(st.nwc-st.nwc/Math.pow(1.15,3))}</span></div><div class="big">NPV = ${L(r.npv)}</div>`+note(`Without working capital it was ${L(r1.npv)}.`)}}},
 {id:'nsv',name:'Net salvage value',short:'Resale, after tax',
  def:'At the end the machine can be sold. If it sells for more than its book value, the gain is taxed. What the firm keeps is the net salvage value.',
  contrast:'The machine was depreciated to zero, so the whole sale price is a taxable gain. Had the book value been higher than the sale price, the loss would save tax and the net salvage would be more than the sale price.',
  ctl:[{key:'salv',label:'Sale price at the end',min:0,max:6,step:0.1,fmt:v=>'₹'+v.toFixed(1)+'L',note:'Book value at the end is zero under SLM.'}],
  draw(s,st){const r=model(st,3),t=st.T/100;return {html:table(r,3,['nsv'],['0','1','2','3']),legend:[],
   work:`<div class="fm">NSV = Salvage − T × (Salvage − Book value)</div><div>= ${st.salv.toFixed(2)} − ${t.toFixed(2)} × (${st.salv.toFixed(2)} − 0)</div><div class="big">NSV = ${L(r.nsvv)}</div>`+note(`NPV with working capital and salvage: ${L(r.npv)}.`)}}},
 {id:'npv',name:'Cash flows and NPV',short:'Discount and add up',
  def:'The last row is the project’s cash flow each year. Discount each one at the required return and add them up.',
  contrast:'The same discounting as in capital budgeting. The hard part of a real project is not the NPV formula; it is getting this table right.',
  ctl:[{key:'R',label:'Required return',min:5,max:30,step:0.5,fmt:v=>v.toFixed(1)+'%',note:''}],

      if(c.type==='seg'){const w=document.createElement('div');w.className='seg';
        c.options.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.classList.toggle('on',S.state[c.key]===v);b.addEventListener('click',()=>{S.state[c.key]=v;[...w.children].forEach(x=>x.classList.toggle('on',x===b));S.render()});w.append(b)});box.append(w);return}
      const id=`s${S.n}-${t.id}-${c.key}`,w=document.createElement('div');w.className='ctl';
      w.innerHTML=`<label for="${id}">${c.label} <output></output></label><input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${Math.min(c.max,Math.max(c.min,S.state[c.key]))}">${c.note?`<small>${c.note}</small>`:''}`;
      const inp=w.querySelector('input'),out=w.querySelector('output');S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);
      inp.addEventListener('input',()=>{S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);S.render()});box.append(w)})}
  S.render=()=>{const t=S.tabs[cur],svg=q('svg');svg.innerHTML='';
    const sp=S.spec(S.state,t.id);q('.spec').hidden=!sp.length;
    q('.spec').innerHTML='<div class="spec-h">'+(S.specH||'The project')+'</div>'+sp.map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('');
    const out=t.draw(svg,S.state),isT=!!out.html;svg.toggleAttribute('hidden',isT);q('.free').hidden=!isT;if(isT)q('.free').innerHTML=out.html;
    q('.work').innerHTML=out.work;q('.legend').hidden=!out.legend.length;
    q('.legend').innerHTML=out.legend.map(([c,l,st])=>`<span><i style="background:${c};${st?'border:1px solid '+st:''}"></i>${l}</span>`).join('')};
  show(0);
});
const rr=()=>STEPS.forEach(S=>S.render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
