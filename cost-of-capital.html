  ctl:[{key:'beta',label:'Beta',min:0.5,max:3,step:0.1,fmt:v=>v.toFixed(1),note:''}],
  draw(s,st){const k=K(),r=5+st.beta*10,{X,Y}=axes(s,k,{xmin:0,xmax:3,ymin:0,ymax:40,xt:0.5,yt:10,fx:v=>v.toFixed(1),xl:'Beta',yl:'Required return',x0:80,x1:640,y0:280,y1:30});
   Ln(s,X(0),Y(5),X(3),Y(35),k.a,3);TB(s,X(1.3),Y(18)+26,'Security market line',{anchor:'end',bold:1,size:12,fill:k.a});
   dot(s,X(0),Y(5),k.f,6);T(s,X(0)+10,Y(5)+16,'RF 5%',{anchor:'start',bold:1,size:12,fill:k.f});
   Ln(s,X(st.beta),Y(0),X(st.beta),Y(r),k.l,1);dot(s,X(st.beta),Y(r),k.d,8,k.surf);TB(s,X(st.beta)-12,Y(r)-12,'cost of equity '+r.toFixed(0)+'%',{anchor:'end',mono:1,bold:1,size:12,fill:k.d});
   return {legend:[[k.a,'SML'],[k.d,'Sahyadri Media']],
    work:`<div class="fm">R = RF + β × (RM − RF)</div><div>= 5% + ${st.beta.toFixed(1)} × 10%</div><div class="big">Cost of equity = ${r.toFixed(0)}%</div>`}}},
 {id:'proj',name:'Using it to judge projects',short:'IRR above or below the SML',
  def:'Sahyadri Media has three independent projects of the same risk as the firm. Each costs ₹100 lakh today and pays once, next year: ₹150, ₹130 or ₹110 lakh.',
  contrast:'Project A earns 50%, above the 30% hurdle: positive NPV, accept. B earns exactly 30%: NPV zero. C earns 10%, below the line: negative NPV, reject, even though 10% sounds respectable.',ctl:[],
  draw(s){const k=K(),{X,Y}=axes(s,k,{xmin:0,xmax:3,ymin:0,ymax:60,xt:0.5,yt:10,fx:v=>v.toFixed(1),xl:'Beta',yl:'IRR',x0:80,x1:640,y0:280,y1:30});
   s.append(el('polygon',{points:[[X(0),Y(5)],[X(3),Y(35)],[X(3),Y(60)],[X(0),Y(60)]].map(p=>p.join(',')).join(' '),fill:k.par,opacity:.08}));
   Ln(s,X(0),Y(5),X(3),Y(35),k.a,3);T(s,X(0.4),Y(48),'Good projects: above the line',{anchor:'start',bold:1,size:12,fill:k.par});T(s,X(0.9),Y(3),'Bad projects: below the line',{anchor:'start',bold:1,size:12,fill:k.d});
   [['A',50,k.par,'+₹15.38L'],['B',30,k.ink,'₹0'],['C',10,k.d,'−₹15.38L']].forEach(([n,v,col,np])=>{dot(s,X(2.5),Y(v),col,7);T(s,X(2.5)+14,Y(v)+5,`${n}: IRR ${v}%, NPV ${np}`,{anchor:'start',bold:1,size:12,fill:col})});
   return {legend:[[k.a,'SML: the required return for each beta'],[k.par,'Accept'],[k.d,'Reject']],
    work:`<div class="fm">NPV at 30% = −100 + cash next year ÷ 1.30</div><div>A: −100 + 150 ÷ 1.30 = <span style="color:var(--par)">+₹15.38L</span></div><div>B: −100 + 130 ÷ 1.30 = ₹0</div><div>C: −100 + 110 ÷ 1.30 = <span style="color:var(--disc)">−₹15.38L</span></div>`+note('Accept projects whose IRR exceeds the cost of equity.')}}}
 ]};

/* ================= STEP 2: what drives beta ================= */
const DIV=[['Automotive retail',2.0],['Hard drives',1.3],['Power utility',0.6]];
const S2={n:2,label:'What drives beta',eyebrow:'Step 2 · Business risk, financial risk, project risk',title:'What Determines Beta?',specH:'The example',
 sub:'Beta comes from the business a firm is in and from how it is financed. And a project’s discount rate should reflect the project’s own beta, not the firm’s.',
 state:{fc:30,dv:50,div:2},
 spec:(st,id)=>id==='op'?[['Sales','₹100L',''],['Variable costs','40% of sales',''],['Fixed costs','₹'+st.fc+'L','d']]:id==='fin'?[['Asset beta','0.90','c'],['Debt beta','0',''],['Debt share of value',st.dv+'%','d']]:[['Firm beta','1.3','c'],['Risk-free rate','4%',''],['Market risk premium','10%','']],
 tabs:[
 {id:'op',name:'Cyclicality and operating leverage',short:'Fixed costs magnify swings',
  def:'Firms whose revenues rise and fall with the business cycle, such as retailers and car makers, have high betas; utilities have low ones. Operating leverage, from high fixed costs, magnifies that cyclicality.',
  contrast:'With high fixed costs, a 10% fall in sales cuts EBIT by much more than 10%, because the costs do not fall with it. That magnifies the firm’s sensitivity to the economy, and so its beta. Note: cyclical is not the same as volatile.',
  ctl:[{key:'fc',label:'Fixed costs',min:0,max:50,step:5,fmt:v=>'₹'+v+'L',note:'Sales ₹100L, variable costs 40% of sales.'}],
  draw(s,st){const k=K(),cm=60,eb=cm-st.fc,dol=cm/eb,eb2=54-st.fc,chg=(eb2-eb)/eb*100;
   const base=250,h=v=>v*3.2;Ln(s,40,base,720,base,k.l,1.5);
   const bar=(x,v,col,lab,sub,shown)=>{Rc(s,x-40,base-h(v),80,h(v),col,{rx:4});T(s,x,base-h(v)-8,'₹'+(shown??v).toFixed(1)+'L',{mono:1,bold:1,size:12,fill:k.ink});T(s,x,base+20,lab,{size:12,bold:1,fill:k.ink});if(sub)T(s,x,base+36,sub,{size:11})};
   T(s,180,30,'Sales',{bold:1,size:14,fill:k.ink});bar(120,40,k.f,'Now','',100);bar(240,36,k.d,'After −10%','',90);
   T(s,520,30,'EBIT',{bold:1,size:14,fill:k.ink});T(s,350,base+58,'Sales and EBIT bars are drawn to different scales',{size:11});bar(460,eb,k.f,'Now','');bar(580,Math.max(0,eb2),k.d,'After','');
   TB(s,520,72,`EBIT falls ${Math.abs(chg).toFixed(1)}%`,{bold:1,size:15,fill:k.d});
   return {legend:[[k.f,'Before'],[k.d,'After sales fall 10%']],
    work:`<div class="fm">DOL = (EBIT + fixed costs) ÷ EBIT</div><div>= (${eb} + ${st.fc}) ÷ ${eb} = <span class="c">${dol.toFixed(2)}</span></div><div class="big">Sales −10% → EBIT −${(dol*10).toFixed(1)}%</div>`}}},
 {id:'fin',name:'Financial leverage',short:'Debt raises the equity beta',
  def:'The asset beta measures the risk of the business. Borrowing does not change the business, but it piles that risk onto fewer equity rupees. With debt beta zero: asset beta = equity beta × E ÷ (D + E).',
  contrast:'Grand Sport is all equity with beta 0.90. Move to one part debt to one part equity and the equity beta doubles to 1.80. Financial leverage always raises the equity beta above the asset beta.',
  ctl:[{key:'dv',label:'Debt as a share of value',min:0,max:75,step:5,fmt:v=>v+'%',note:'Debt assumed risk free (beta 0).'}],
  draw(s,st){const k=K(),d=st.dv/100,be=0.9/(1-d),base=270,h=v=>v*60;Ln(s,40,base,720,base,k.l,1.5);
   Rc(s,120,base-h(0.9),100,h(0.9),k.f,{rx:4});T(s,170,base-h(0.9)-8,'0.90',{mono:1,bold:1,size:14,fill:k.f});T(s,170,base+20,'Asset beta',{bold:1,size:12,fill:k.ink});T(s,170,base+36,'the business',{size:11});
   Rc(s,300,base-h(Math.min(be,3.6)),100,h(Math.min(be,3.6)),k.d,{rx:4});T(s,350,base-h(Math.min(be,3.6))-8,be.toFixed(2),{mono:1,bold:1,size:14,fill:k.d});T(s,350,base+20,'Equity beta',{bold:1,size:12,fill:k.ink});T(s,350,base+36,'what shareholders bear',{size:11});
   const bx=500,bw=200,bh=200,by=50;Rc(s,bx,by,bw,bh*(1-d),k.aS,{stroke:k.a,rx:0});Rc(s,bx,by+bh*(1-d),bw,bh*d,k.fa,{stroke:k.l,rx:0});
   T(s,bx+bw/2,by+bh*(1-d)/2+5,'Equity '+(100-st.dv)+'%',{bold:1,size:13,fill:k.a});if(d>0.08)T(s,bx+bw/2,by+bh*(1-d)+bh*d/2+5,'Debt '+st.dv+'%',{bold:1,size:13,fill:k.ink});T(s,bx+bw/2,by-10,'Financing',{size:12});
   return {legend:[[k.f,'Asset beta'],[k.d,'Equity beta']],
    work:`<div class="fm">β asset = (E ÷ V) × β equity</div><div>0.90 = ${(1-d).toFixed(2)} × β equity</div><div class="big">β equity = ${be.toFixed(2)}</div>`}}},
 {id:'proj',name:'The firm versus the project',short:'Use the project’s own risk',
  def:'Conglomerate Company has a beta of 1.3, so its cost of capital is 4% + 1.3 × 10% = 17%. But it runs three very different businesses, each a third of the firm.',
  contrast:'A project’s discount rate depends on the use of the money, not its source. Using 17% for everything rejects good utility projects and accepts bad car-retail projects; over time the firm gets riskier and loses value.',
  ctl:[{key:'div',type:'seg',options:[[0,'Auto retail'],[1,'Hard drives'],[2,'Power utility']]}],
  draw(s,st){const k=K(),{X,Y}=axes(s,k,{xmin:0,xmax:2.5,ymin:0,ymax:30,xt:0.5,yt:5,fx:v=>v.toFixed(1),xl:'Project beta',yl:'Required return',x0:80,x1:640,y0:280,y1:30});
   s.append(el('polygon',{points:[[X(0),Y(4)],[X(1.3),Y(17)],[X(0),Y(17)]].map(p=>p.join(',')).join(' '),fill:k.d,opacity:.10}));
   s.append(el('polygon',{points:[[X(1.3),Y(17)],[X(2.5),Y(29)],[X(2.5),Y(17)]].map(p=>p.join(',')).join(' '),fill:k.d,opacity:.10}));
   Ln(s,X(0),Y(4),X(2.5),Y(29),k.a,3);Ln(s,X(0),Y(17),X(2.5),Y(17),k.ink,1.5);T(s,X(0)+6,Y(17)-6,'one rate for all: 17%',{anchor:'start',size:11,fill:k.ink});
   T(s,X(0.3),Y(13),'wrongly rejected',{anchor:'start',size:11,bold:1,fill:k.d});T(s,X(1.75),Y(19),'wrongly accepted',{anchor:'start',size:11,bold:1,fill:k.d});
   DIV.forEach(([n,b],i)=>{const r=4+10*b,on=i===st.div;dot(s,X(b),Y(r),on?k.d:k.a,on?8:6,on?k.surf:undefined);T(s,X(b)+12,Y(r)+16,n+': '+r.toFixed(0)+'%',{anchor:'start',bold:on,size:12,fill:on?k.d:k.m})});
   const [n,b]=DIV[st.div],r=4+10*b;
   return {legend:[[k.a,'SML: the right rate for each beta'],[k.d,'Errors from one firm-wide rate']],
    work:`<div class="fm">${n}: R = 4% + ${b.toFixed(1)} × 10%</div><div class="big">Discount rate = ${r.toFixed(0)}%</div>`+note(r<17?'Lower than the firm’s 17%: using 17% would reject good projects here.':r>17?'Higher than the firm’s 17%: using 17% would accept bad projects here.':'Same as the firm: this division matches the firm’s average risk.')}}}
 ]};

/* ================= STEP 3: WACC ================= */
const S3={n:3,label:'WACC',eyebrow:'Step 3 · Blending equity and debt',title:'Weighted Average Cost of Capital',solo:true,specH:'The example',
 sub:'Most firms use both equity and debt. The firm’s cost of capital is a weighted average of the two, with debt’s cost reduced for tax because interest is tax-deductible.',
 state:{dv:32,tc:37},
 spec:(st)=>[['Industry beta','0.82','c'],['Risk-free, MRP','3%, 8.4%',''],['Yield on debt','8%','d'],['Tax rate',st.tc+'%','']],
 tabs:[{id:'wacc',name:'Computing the WACC',short:'',
  def:'Step one: cost of equity from CAPM, 3% + 0.82 × 8.4% = 9.89%. Cost of debt from the yield on the firm’s bonds, 8%, cut to 8% × (1 − tax) because interest saves tax. Step two: weight each by its share of the firm’s value.',
  contrast:'Use the WACC to discount a project only when the project has the same risk as the firm as a whole and is financed with the same mix of debt and equity. Otherwise go back to Step 2 and use the project’s own risk.',
  ctl:[{key:'dv',label:'Debt as a share of value',min:0,max:70,step:1,fmt:v=>v+'%',note:'The example uses 32%.'},{key:'tc',label:'Tax rate',min:0,max:45,step:1,fmt:v=>v+'%',note:''}],
  draw(s,st){const k=K(),re=3+0.82*8.4,rd=8,d=st.dv/100,t=st.tc/100,rda=rd*(1-t),w=(1-d)*re+d*rda;
   const bx=90,bw=520,y1=70,hh=56;T(s,bx,y1-14,'Share of value',{anchor:'start',size:12});
   Rc(s,bx,y1,bw*(1-d),hh,k.a,{rx:0});if(d>0)Rc(s,bx+bw*(1-d),y1,bw*d,hh,k.f,{rx:0});
   T(s,bx+bw*(1-d)/2,y1+34,'Equity '+(100-st.dv)+'%',{bold:1,size:14,fill:k.surf});if(d>0.1)T(s,bx+bw*(1-d)+bw*d/2,y1+34,'Debt '+st.dv+'%',{bold:1,size:14,fill:k.surf});
   const y2=180;T(s,bx,y2-14,'Contribution to WACC',{anchor:'start',size:12});const sc=bw/12;
   Rc(s,bx,y2,(1-d)*re*sc,hh,k.a,{rx:0,op:.85});Rc(s,bx+(1-d)*re*sc,y2,d*rda*sc,hh,k.f,{rx:0,op:.85});
   T(s,bx+(1-d)*re*sc/2,y2+34,((1-d)*re).toFixed(2)+'%',{mono:1,bold:1,size:13,fill:k.surf});if(d*rda*sc>50)T(s,bx+(1-d)*re*sc+d*rda*sc/2,y2+34,(d*rda).toFixed(2)+'%',{mono:1,bold:1,size:13,fill:k.surf});
   T(s,bx+w*sc+12,y2+34,'= '+w.toFixed(2)+'%',{anchor:'start',mono:1,bold:1,size:18,fill:k.d});
   T(s,bx,290,`Cost of equity ${re.toFixed(2)}%   ·   after-tax cost of debt ${rda.toFixed(2)}%`,{anchor:'start',mono:1,size:12,fill:k.ink});
   return {legend:[[k.a,'Equity'],[k.f,'Debt, after tax']],
    work:`<div class="fm">WACC = E/V × Re + D/V × Rd × (1 − Tc)</div><div>= ${(1-d).toFixed(2)} × ${re.toFixed(2)}% + ${d.toFixed(2)} × 8% × ${(1-t).toFixed(2)}</div><div class="big">WACC = ${w.toFixed(2)}%</div>`+note('At 32% debt and 37% tax: 8.34%, as in the deck.')}}}]};

const STEPS=[S1,S2,S3];

/* ================= framework ================= */
const stepper=document.getElementById('stepper'),host=document.getElementById('steps');
STEPS.forEach((S,si)=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',si===0);b.innerHTML=`<small>Step ${S.n}</small><span>${S.label}</span>`;
  b.addEventListener('click',()=>{[...stepper.children].forEach(x=>x.setAttribute('aria-selected',x===b));STEPS.forEach(X=>X.sec.hidden=X!==S);S.render();window.scrollTo({top:0,behavior:'smooth'})});
  stepper.append(b);
  const sec=document.createElement('section');sec.className='step';sec.hidden=si>0;S.sec=sec;
  sec.innerHTML=`<div class="wrap"><header><p class="eyebrow">${S.eyebrow}</p><h2 class="steph">${S.title}</h2><p class="sub">${S.sub}</p><div class="spec" aria-label="The project"></div></header>
   <div class="layout"><div class="index" role="tablist" aria-label="Concepts"></div>
   <section class="stage" role="tabpanel" aria-live="polite"><h2 class="nm"></h2><p class="def"></p>
   <svg viewBox="0 0 760 330" role="img"></svg><div class="free" hidden></div><div class="trio legend"></div>
   <div class="readout"><div class="work"></div><div class="ctl"></div></div>
   <p class="contrast"></p><div class="nav"><button class="btn prev">Previous</button><button class="btn primary next">Next</button></div></section></div></div>`;
  host.append(sec);
  const q=c=>sec.querySelector(c),idx=q('.index');let cur=0;
  if(S.solo){q('.layout').classList.add('solo');if(S.tabs.length===1)idx.hidden=true;else idx.classList.add('desk-hide')}
  S.tabs.forEach((t,i)=>{const bt=document.createElement('button');bt.className='term';bt.setAttribute('role','tab');bt.innerHTML=`<b>${t.name}</b><span>${t.short}</span>`;bt.addEventListener('click',()=>show(i));idx.append(bt)});
  q('.prev').addEventListener('click',()=>show(cur-1));q('.next').addEventListener('click',()=>{if(cur<S.tabs.length-1)show(cur+1);else if(STEPS[si+1])stepper.children[si+1].click()});
  function show(i){cur=Math.max(0,Math.min(S.tabs.length-1,i));const t=S.tabs[cur];
    [...idx.children].forEach((b,j)=>b.setAttribute('aria-selected',j===cur));
    q('.nm').textContent=t.name;q('.def').textContent=t.def;q('.contrast').textContent=t.contrast;
    q('.prev').disabled=cur===0;const last=cur===S.tabs.length-1;q('.next').disabled=last&&!STEPS[si+1];q('.next').textContent=last&&STEPS[si+1]?'Next: '+STEPS[si+1].label:'Next';
    q('.prev').style.visibility=S.tabs.length===1&&si===0?'hidden':'';q('.next').style.visibility=last&&!STEPS[si+1]?'hidden':'';
    if(S.tabs.length===1&&si>0){q('.prev').disabled=false;q('.prev').textContent='Previous: '+STEPS[si-1].label;q('.prev').onclick=()=>stepper.children[si-1].click()}
    q('svg').setAttribute('aria-label',t.name+' chart');buildCtl(t);S.render()}
  function buildCtl(t){const box=q('.ctl');box.innerHTML='';box.hidden=!t.ctl.length;q('.readout').classList.toggle('noctl',!t.ctl.length);
    t.ctl.forEach(c=>{
      if(c.type==='seg'){const w=document.createElement('div');w.className='seg';
        c.options.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.classList.toggle('on',S.state[c.key]===v);b.addEventListener('click',()=>{S.state[c.key]=v;[...w.children].forEach(x=>x.classList.toggle('on',x===b));S.render()});w.append(b)});box.append(w);return}
      const id=`s${S.n}-${t.id}-${c.key}`,w=document.createElement('div');w.className='ctl';
      w.innerHTML=`<label for="${id}">${c.label} <output></output></label><input id="${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${Math.min(c.max,Math.max(c.min,S.state[c.key]))}">${c.note?`<small>${c.note}</small>`:''}`;
      const inp=w.querySelector('input'),out=w.querySelector('output');S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);
      inp.addEventListener('input',()=>{S.state[c.key]=+inp.value;out.textContent=c.fmt(+inp.value);S.render()});box.append(w)})}
  S.render=()=>{const t=S.tabs[cur],svg=q('svg');svg.innerHTML='';
    const sp=S.spec(S.state,t.id);q('.spec').hidden=!sp.length;
    q('.spec').innerHTML='<div class="spec-h">'+(S.specH||'The project')+'</div>'+sp.map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('');
    const out=t.draw(svg,S.state),isT=!!out.html;svg.toggleAttribute('hidden',isT);q('.free').hidden=!isT;if(isT)q('.free').innerHTML=out.html;
    q('.work').innerHTML=out.work;q('.legend').hidden=!out.legend.length;
    q('.legend').innerHTML=out.legend.map(([c,l,st])=>`<span><i style="background:${c};${st?'border:1px solid '+st:''}"></i>${l}</span>`).join('')};
  show(0);
});
const rr=()=>STEPS.forEach(S=>S.render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

})();
</script>

</html>
